<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - lights - spot light</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="style.css">
	</head>
	<body>

		<script type="importmap">
			{
				"imports": {
					"three": "./src/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">
			
			import * as THREE from 'three';
			import TWEEN from './src//tween.module.js';
			import { OrbitControls } from './src/OrbitControls.js';
			import { GLTFLoader } from './src/GLTFLoader.js';
			

			const renderer = new THREE.WebGLRenderer( { antialias: true } );
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( animate );

			const camera = new THREE.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 0.5, 300 );
			

			const controls = new OrbitControls( camera, renderer.domElement );

			const scene = new THREE.Scene();

			const matFloor = new THREE.MeshPhongMaterial( { color: 0x808080 } );
			const matBox = new THREE.MeshPhongMaterial( { color: 0xaaaaaa } );
			

			const geoFloor = new THREE.PlaneGeometry( 100, 100 );
			const geoBox = new THREE.BoxGeometry( 0.3, 0.1, 0.2 );

			const mshFloor = new THREE.Mesh( geoFloor, matFloor );
			mshFloor.rotation.x = - Math.PI * 0.5;
			//const mshBox = new THREE.Mesh( geoBox, matBox );

			const ambient = new THREE.AmbientLight( 0x444444 );

			const spotLight1 = createSpotlight( 0xFF7F00 );
			const spotLight2 = createSpotlight( 0x00FF7F );
			const spotLight3 = createSpotlight( 0x7F00FF );

			let lightHelper1, lightHelper2, lightHelper3, billie, building;

			function init() {

				renderer.shadowMap.enabled = true;
				renderer.shadowMap.type = THREE.PCFShadowMap;

				camera.position.set( 4.6, 2.2, - 2.1 );

				spotLight1.position.set( 1.5, 4, 4.5 );
				spotLight2.position.set( 0, 4, 3.5 );
				spotLight3.position.set( - 1.5, 4, 4.5 );

				lightHelper1 = new THREE.SpotLightHelper( spotLight1 );
				lightHelper2 = new THREE.SpotLightHelper( spotLight2 );
				lightHelper3 = new THREE.SpotLightHelper( spotLight3 );

				mshFloor.receiveShadow = true;
				mshFloor.position.set( 0, - 0.05, 0 );
				

				//mshBox.castShadow = true;
				//mshBox.receiveShadow = true;
				//mshBox.position.set( 0, 0.5, 0 );

				scene.add( mshFloor );
				//scene.add( mshBox );
				scene.add( ambient );
				scene.add( spotLight1, spotLight2, spotLight3 );
				scene.add( lightHelper1, lightHelper2, lightHelper3 );
				spotLight1.scale.set (100, 100, 100);
				lightHelper1.scale.set (100, 100, 100);
				

				document.body.appendChild( renderer.domElement );
				window.addEventListener( 'resize', onWindowResize );

				controls.target.set( 0, 0.5, 0 );
				controls.maxPolarAngle = Math.PI / 2;
				controls.minDistance = 1;
				controls.maxDistance = 100;
				controls.update();

			}
			
			//3D Models
			const loader = new GLTFLoader();
		loader.load( './assets/stage.glb', function ( gltf ) {

            building = gltf.scene;
            building.scale.set (0.6,0.6,0.6);
            building.position.set(0,0,0);
			building.receiveShadow = true;
			building.traverse((child) => {
			if (child.isMesh) {
				child.castShadow = true;
				child.receiveShadow = true;
				// Optionally, you can modify specific properties
				// child.material.wireframe = true;
			}
		});

            scene.add( building ); 
            //createGUI( bear, gltf.animations );

        }, undefined, function ( e ) {

            console.error( e );

        } );  
			
		loader.load( './assets/billie_eilish.glb', function ( gltf ) {

            billie = gltf.scene;
            billie.scale.set (0.3,0.3,0.3);
            billie.position.set(0,0.45,0);
			billie.receiveShadow = true;
			billie.traverse((child) => {
			if (child.isMesh) {
				child.castShadow = true;
				child.receiveShadow = true;
				// Optionally, you can modify specific properties
				// child.material.wireframe = true;
			}
		});

            scene.add( billie ); 
            //createGUI( bear, gltf.animations );

        }, undefined, function ( e ) {

            console.error( e );

        } );  
			 const listener = new THREE.AudioListener();
camera.add(listener);

const audioLoader = new THREE.AudioLoader();
const backgroundSound = new THREE.Audio(listener);

audioLoader.load('./assets/intro.mp3', function(buffer) {
	backgroundSound.setBuffer(buffer);
	backgroundSound.setLoop(true);
	backgroundSound.setVolume(0.4);

	// Try autoplay if user already allowed it before
	if (localStorage.getItem("audioEnabled") === "true") {
		if (listener.context.state === "suspended") {
			listener.context.resume().then(() => {
				backgroundSound.play();
			});
		} else {
			backgroundSound.play();
		}
	}
});
	
	document.addEventListener("click", () => {
	localStorage.setItem("audioEnabled", "true");

	if (listener.context.state === "suspended") {
		listener.context.resume().then(() => {
			if (!backgroundSound.isPlaying) {
				backgroundSound.play();
			}
		});
	} else {
		if (!backgroundSound.isPlaying) {
			backgroundSound.play();
		}
	}
}, { once: true });
			
			const video = document.createElement('video');
			video.src = './assets/Billie_Eilish.mp4'; 
			video.loop = true;
			video.muted = true;
			video.play();
			
			const videoTexture = new THREE.VideoTexture(video);
			videoTexture.minFilter = THREE.LinearFilter;
			videoTexture.magFilter = THREE.LinearFilter;
			videoTexture.format = THREE.RGBAFormat;
			
			const screenGeometry = new THREE.PlaneGeometry(3, 2); // adjust size
			const screenMaterial = new THREE.MeshBasicMaterial({
				map: videoTexture
			});

			const screen1 = new THREE.Mesh(screenGeometry, screenMaterial);
			screen1.position.set(0, 3, -1.5);
			screen1.rotation.y = Math.PI;

			// front left screen
			const screen2 = new THREE.Mesh(screenGeometry, screenMaterial);
			screen2.position.set(-1.5, 3, 0);
			screen2.rotation.y = Math.PI / -2;

			// front middle screen
			const screen3 = new THREE.Mesh(screenGeometry, screenMaterial);
			screen3.position.set(0, 3, 1.5);

			// front right screen
			const screen4 = new THREE.Mesh(screenGeometry, screenMaterial);
			screen4.position.set(1.5, 3, 0);
			screen4.rotation.y = Math.PI / 2;

			scene.add(screen1, screen2, screen3, screen4);

			
			
			

			function createSpotlight( color ) {

				const newObj = new THREE.SpotLight( color, 10 );

				newObj.castShadow = true;
				newObj.angle = 0.3;
				newObj.penumbra = 0.2;
				newObj.decay = 2;
				newObj.distance = 50;

				return newObj;

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function tween( light ) {

				new TWEEN.Tween( light ).to( {
					angle: ( Math.random() * 0.7 ) + 0.1,
					penumbra: Math.random() + 1
				}, Math.random() * 3000 + 2000 )
					.easing( TWEEN.Easing.Quadratic.Out ).start();

				new TWEEN.Tween( light.position ).to( {
					x: ( Math.random() * 30 ) - 15,
					y: ( Math.random() * 15 ) + 5,
					z: ( Math.random() * 30) - 15
				}, Math.random() * 3000 + 2000 )
					.easing( TWEEN.Easing.Quadratic.Out ).start();

			}
			
		
			const color = 0xcccccc;
			const density = 0.5; // Use a very low number for "slight"
			scene.fog = new THREE.FogExp2(color, density);
			
			
			//Lights__________
			const glowBalls = new THREE.Group();
			scene.add(glowBalls);

			for (let i = 0; i < 9999; i++) {
				const color = new THREE.Color(Math.random() * 0xffffff);

				const ball = new THREE.Mesh(
					new THREE.SphereGeometry(0.03, 16, 8),
					new THREE.MeshBasicMaterial({ color: color })
				);

				ball.position.set(
					Math.random() * 30 - 15,
					0.08,
					Math.random() * 30 - 15
				);

				glowBalls.add(ball);
			}
			
			

			function updateTweens() {

				tween( spotLight1 );
				tween( spotLight2 );
				tween( spotLight3 );

				setTimeout( updateTweens, 5000 );

			}

			function animate() {

				TWEEN.update();

				if ( lightHelper1 ) lightHelper1.update();
				if ( lightHelper2 ) lightHelper2.update();
				if ( lightHelper3 ) lightHelper3.update();
				
				const time = performance.now() * 0.001;

				glowBalls.children.forEach((ball, i) => {
					ball.position.y = 0.08 + Math.sin(time * 2 + i) * 0.03;
				});

				renderer.render( scene, camera );

			}

			init();
			updateTweens();

		</script>
	</body>
</html>
